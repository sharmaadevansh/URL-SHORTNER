services:
  mongodb:
    image: mongo:7.0
    container_name: linkforge-mongodb
    restart: unless-stopped
    # Memory optimization for 2GB EC2 RAM: cap WiredTiger cache to 256MB
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    # Security: No public port binding — DB accessible only inside internal Docker network
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - linkforge-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    # Memory optimization for 2GB EC2 RAM: cap memory to 128MB with LRU eviction
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Security: No public port binding — Redis accessible only inside internal Docker network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - linkforge-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: linkforge-api
    restart: unless-stopped
    # API port internal only — Nginx reverse proxy routes to it
    expose:
      - "4000"
    # Secrets loaded from .env.production on the EC2 host, never committed to Git
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/linkforge
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - NODE_OPTIONS=--max-old-space-size=256
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linkforge-net

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: linkforge-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/linkforge
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=192
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linkforge-net

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: linkforge-web
    restart: unless-stopped
    # Web port internal only — Nginx reverse proxy routes to it
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://api:4000
      - NODE_OPTIONS=--max-old-space-size=384
    depends_on:
      - api
    networks:
      - linkforge-net

  nginx:
    image: nginx:alpine
    container_name: linkforge-nginx
    restart: unless-stopped
    # Only Nginx is public-facing on Port 80 (and 443 if SSL configured)
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - linkforge-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: linkforge-prometheus
    restart: unless-stopped
    # Limit Prometheus retention on 2GB EC2 RAM to conserve disk and memory
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=512MB"
    expose:
      - "9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - linkforge-net

networks:
  linkforge-net:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
