name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Shared Contracts
        run: npm run build -w @linkforge/shared

      - name: Run Test Suite
        run: |
          npm run test -w @linkforge/api
          npm run test -w @linkforge/worker
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/linkforge_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_super_secure_32chars!
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_super_secure_32chars!

      - name: Build API & Worker
        run: |
          npm run build -w @linkforge/api
          npm run build -w @linkforge/worker

      - name: Build Next.js Web Frontend
        run: npm run build -w @linkforge/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
