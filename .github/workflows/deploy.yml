name: CD Pipeline - AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build Images & Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Build all images with both commit SHA tag (immutable) and latest tag
          docker build -t $REGISTRY/linkforge-api:$COMMIT_SHA -t $REGISTRY/linkforge-api:latest -f infra/docker/Dockerfile.api .
          docker build -t $REGISTRY/linkforge-worker:$COMMIT_SHA -t $REGISTRY/linkforge-worker:latest -f infra/docker/Dockerfile.worker .
          docker build -t $REGISTRY/linkforge-web:$COMMIT_SHA -t $REGISTRY/linkforge-web:latest -f infra/docker/Dockerfile.web .

          # Push SHA-tagged images (used for deployment — immutable, auditable)
          docker push $REGISTRY/linkforge-api:$COMMIT_SHA
          docker push $REGISTRY/linkforge-worker:$COMMIT_SHA
          docker push $REGISTRY/linkforge-web:$COMMIT_SHA

          # Also push latest (for convenience, not for deployment)
          docker push $REGISTRY/linkforge-api:latest
          docker push $REGISTRY/linkforge-worker:latest
          docker push $REGISTRY/linkforge-web:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,COMMIT_SHA
          script: |
            set -e
            export REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            export COMMIT_SHA="${{ github.sha }}"

            echo "=== Deploying LinkForge version $COMMIT_SHA ==="

            # Ensure repo is on EC2
            if [ ! -d /opt/linkforge ]; then
              git clone ${{ github.server_url }}/${{ github.repository }} /opt/linkforge
            fi

            cd /opt/linkforge
            git pull origin main

            # Authenticate EC2 Docker with ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $REGISTRY

            # Update docker-compose with the new image tags
            export API_IMAGE="$REGISTRY/linkforge-api:$COMMIT_SHA"
            export WORKER_IMAGE="$REGISTRY/linkforge-worker:$COMMIT_SHA"
            export WEB_IMAGE="$REGISTRY/linkforge-web:$COMMIT_SHA"

            # Pull the new images first (before stopping old ones)
            docker pull $API_IMAGE
            docker pull $WORKER_IMAGE
            docker pull $WEB_IMAGE

            # Bring up new containers (rolling — MongoDB & Redis stay running)
            IMAGE_API=$API_IMAGE IMAGE_WORKER=$WORKER_IMAGE IMAGE_WEB=$WEB_IMAGE \
              docker compose up -d --remove-orphans --no-build

            # Wait for services to settle
            sleep 15

            # Health check
            HEALTH=$(curl -sf http://localhost/health/ready 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q "ready"; then
              echo "✅ Deployment succeeded and verified healthy!"
            else
              echo "❌ Health check failed — rolling back to previous containers..."
              docker compose up -d --remove-orphans
              exit 1
            fi
